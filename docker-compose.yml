name: moshi

services:
  moshi:
    build:
      context: ./moshi
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8998"
      - --hf-repo
      - ${HF_REPO:-kyutai/moshiko-pytorch-bf16}
    ports:
      - "${MOSHI_BIND_ADDRESS:-0.0.0.0}:${MOSHI_PORT:-8998}:8998"
    environment:
      HF_HOME: /mnt/data/huggingface_moshi
    init: true
    restart: unless-stopped
    volumes:
      - "${HF_CACHE_DIR:-/mnt/data/huggingface_moshi}:/mnt/data/huggingface_moshi"
      - uv-cache:/root/.cache/uv
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all

volumes:
  uv-cache:
